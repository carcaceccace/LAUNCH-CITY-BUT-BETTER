<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Launcher</title>
<style>
html, body { margin: 0; height: 100%; background: #0a0e27; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
#panel { display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  width: min(92vw, 430px); box-sizing: border-box; padding: 14px 18px; text-align: center;
  background: rgba(14, 18, 48, .82); backdrop-filter: blur(8px); color: #fff; font: 14px Arial, sans-serif;
  border: 2px solid #05c46b; border-radius: 16px; box-shadow: 0 0 24px rgba(5, 196, 107, .35); }
#panel input { width: 100%; margin: 10px 0 4px; accent-color: #ffdd59; }
#panel #info { color: #ffdd59; font-weight: bold; margin-bottom: 6px; }
#panel #forceLine { color: #d2dae2; font-size: 12px; margin-bottom: 10px; }
#panel button { background: linear-gradient(#ffe680, #ffb830); border: 0; border-radius: 10px; padding: 9px 34px;
  font: bold 16px Impact, Arial, sans-serif; letter-spacing: 1px; cursor: pointer; box-shadow: 0 3px 0 #b87a00; }
#panel button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b87a00; }
#mute, #music { position: fixed; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); background: rgba(14,18,48,.7); color: #fff; font-size: 18px; cursor: pointer; }
#music { right: 62px; }
#music.off { opacity: .45; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div id="info"></div>
  <div>Launch speed: <b id="val">10.0</b> m/s</div>
  <input type="range" id="spd" min="2" max="30" step="0.1" value="10">
  <div id="forceLine"></div>
  <button id="go">LAUNCH</button>
</div>
<button id="mute" title="Sound on/off (M)">🔊</button>
<button id="music" title="Music on/off (N)">🎵</button>
<script>
const BASE_WIDTH = 1000, BASE_HEIGHT = 600;
const GRAVITY = 0.40, SKY_LIMIT = 30;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---------- assets (optional; fall back to shapes if missing) ----------
function loadImg(src) {
  const img = new Image();
  img.ok = false;
  img.onload = () => { img.ok = true; };
  img.onerror = () => { img.ok = false; };
  img.src = src;
  return img;
}
const bgImg = loadImg("background.png");
const buildingImg = loadImg("building.png");

// mass, color, name, slide, sprite base name
const roster = [
  [1.0, "#ff3f34", "Arachne (1.0kg)", 0.0,  "small"],
  [2.5, "#05c46b", "Nemesis (2.5kg)", 0.72, "medium"],
  [5.0, "#34e7e4", "Dango (5.0kg)",   0.50, "large"],
];
const spriteCache = {};
function getSprites(base) {
  if (!spriteCache[base]) {
    spriteCache[base] = {
      idle: loadImg(base + "_idle.png"),
      launched: loadImg(base + "_launched.png"),
      landed: loadImg(base + "_landed.png"),
    };
  }
  return spriteCache[base];
}

// ---------- state ----------
let gameState = "MENU";
let highScores = [];
let cameraScroll = 0, targetScroll = 0;
let aiming = false, mx = 0, my = 0;
let score = 0, currentBuildingIdx = 0, currentForce = 0;
let buildings = [];
let charIdx = 0, charMass, charColor, charName, charSlide, charSprites, charRadius;
let charX, charY, charVx = 0, charVy = 0, isLaunched = false, isSliding = false;
let sw = 0, sh = 0;
// predict mode
let predictMode = false, lives = 3, restX = 0, predictRight = false, toast = null;
const PREDICT_ANGLES = [45, 50, 55, 60, 65, 70, 75, 80];  // degrees; 45 unless the round needs steeper
let roundCache = null;
let particles = [], trail = [], shake = 0, ballAngle = 0;   // visual flair
const muteBtn = document.getElementById("mute"), musicBtn = document.getElementById("music");
const AIM_SENS = 0.35;   // force per pixel of drag (was 0.75: too touchy, caused overshoots)
const MAX_SPEED = 30;    // launch speed cap so light balls can't fly absurdly far
const ACTIVE_AHEAD = 1;  // buildings you can land on beyond the current one (1 = current + next only)
const PERFECT_TOLERANCE = 0.04;        // within 4% of ideal speed = double points
const panel = document.getElementById("panel"), infoEl = document.getElementById("info"),
      valEl = document.getElementById("val"), spdEl = document.getElementById("spd"),
      forceEl = document.getElementById("forceLine");
document.getElementById("go").addEventListener("click", () => { startMusic(); predictLaunch(); });

function lbKey() { return predictMode ? "high_scores_predict" : "high_scores"; }
function loadLeaderboard() {
  try {
    const raw = JSON.parse(localStorage.getItem(lbKey()) || "[]");
    highScores = raw.filter(Number.isInteger);
  } catch (e) { highScores = []; }
  highScores.sort((a, b) => b - a);
  highScores = highScores.slice(0, 5);
}
function saveScore() {
  highScores.push(score);
  highScores.sort((a, b) => b - a);
  highScores = highScores.slice(0, 5);
  try { localStorage.setItem(lbKey(), JSON.stringify(highScores)); } catch (e) {}
}
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

function setupBuildings() {
  buildings = [{ x: 80, y: 420, w: 140, h: 180 }];
  let lastX = 80;
  for (let i = 0; i < 120; i++) {
    const gap = randInt(180, 280), width = randInt(110, 150), height = randInt(200, 380);
    lastX += gap + 50;
    buildings.push({ x: lastX, y: BASE_HEIGHT - height, w: width, h: height });
  }
}

function spawnCharacter() {
  const [mass, color, name, slide, base] = roster[charIdx];
  charMass = mass; charColor = color; charName = name; charSlide = slide;
  charSprites = getSprites(base);
  charRadius = 36 + Math.floor(mass * 3.0);
  const b = buildings[currentBuildingIdx];
  charX = b.x + Math.floor(b.w / 2);
  charY = b.y - charRadius;
  charVx = 0; charVy = 0; restX = charX;
  isLaunched = false; isSliding = false; currentForce = 0;
}

function startNewRun(idx) {
  sfx.click();
  score = 0; currentBuildingIdx = 0; cameraScroll = 0; targetScroll = 0;
  lives = 3; toast = null; predictRight = false; loadLeaderboard();
  particles = []; trail = []; shake = 0; ballAngle = 0;
  charIdx = idx;
  setupBuildings();
  spawnCharacter();
  gameState = "PLAYING";
}

function lockPosition(b) {
  charVx = 0; restX = charX;
  targetScroll = b.x + Math.floor(b.w / 2) - 160;
  currentForce = 0;
}

// ---------- input ----------
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (sw / r.width), (e.clientY - r.top) * (sh / r.height)];
}
function buttonBounds() {
  const sx = sw / BASE_WIDTH, sy = sh / BASE_HEIGHT;
  const cx = Math.floor(sw / 2);
  const y1 = Math.floor(sh * 0.73);
  return { cx, y1, y2: y1 + Math.floor(50 * sy), sx, sy };
}
canvas.addEventListener("pointerdown", (e) => {
  ac(); startMusic();
  const [x, y] = pos(e);
  if (gameState === "PLAYING") {
    if (!predictMode && !isLaunched && !isSliding) {
      aiming = true; mx = x; my = y;
      canvas.setPointerCapture(e.pointerId);
    }
  } else {
    const { cx, y1, y2, sx, sy } = buttonBounds();
    const ty = toggleY() * sy;
    if (y >= ty && y <= ty + 32 * sy) {
      if (x >= cx - 125 * sx && x <= cx - 5 * sx) { predictMode = false; loadLeaderboard(); sfx.click(); }
      else if (x >= cx + 5 * sx && x <= cx + 125 * sx) { predictMode = true; loadLeaderboard(); sfx.click(); }
    }
    if (y >= y1 && y <= y2) {
      if (x >= cx - 240 * sx && x <= cx - 80 * sx) startNewRun(0);
      else if (x > cx - 80 * sx && x <= cx + 80 * sx) startNewRun(1);
      else if (x > cx + 80 * sx && x <= cx + 240 * sx) startNewRun(2);
    }
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (gameState === "PLAYING" && aiming) {
    [mx, my] = pos(e);
    const sx = sw / BASE_WIDTH, sy = sh / BASE_HEIGHT;
    const dist = Math.hypot(mx - (charX - cameraScroll) * sx, my - charY * sy);
    currentForce = Math.min((dist / sx) * AIM_SENS, 200);
  }
});
canvas.addEventListener("pointerup", () => {
  if (gameState === "PLAYING" && aiming) {
    aiming = false;
    const sx = sw / BASE_WIDTH, sy = sh / BASE_HEIGHT;
    const dx = mx - (charX - cameraScroll) * sx;
    const dy = my - charY * sy;
    const angle = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);
    const force = Math.min((dist / sx) * AIM_SENS, 200);
    const speed = Math.min((force / charMass) * 0.42, MAX_SPEED);
    charVx = speed * Math.cos(angle);
    charVy = speed * Math.sin(angle);
    isLaunched = true;
    sfx.launch();
  }
});

// ---------- predict mode ----------
function toggleY() { return gameState === "MENU" ? 215 : 340; }

// x where the ball's bottom comes DOWN through the next roof's level (game's own gravity step)
function simLandX(speed, ang, nb) {
  let x = charX, y = charY;
  const vx = speed * Math.cos(ang);
  let vy = -speed * Math.sin(ang);
  for (let i = 0; i < 4000; i++) {
    const prevBottom = y + charRadius;
    vy += GRAVITY; x += vx; y += vy;
    if (vy > 0 && prevBottom < nb.y && y + charRadius >= nb.y) return x;
  }
  return -1e9;
}
// speed that lands at the centre of the next roof, or null if this angle can't do it
function solveSpeed(ang, nb) {
  const target = nb.x + nb.w / 2;
  let lo = 0.5, hi = 120;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (simLandX(mid, ang, nb) < target) lo = mid; else hi = mid;
  }
  return Math.abs(simLandX(hi, ang, nb) - target) < 3 ? hi : null;
}
// shallowest angle (45 first, then steeper) that has a valid answer for this round
function getRound() {
  const nb = buildings[currentBuildingIdx + 1];
  if (!nb) return null;
  const key = currentBuildingIdx + ":" + Math.round(charX);
  if (!roundCache || roundCache.key !== key) {
    let angle = PREDICT_ANGLES[0], ideal = null;
    for (const deg of PREDICT_ANGLES) {
      angle = deg;
      ideal = solveSpeed(deg * Math.PI / 180, nb);
      if (ideal !== null) break;
    }
    roundCache = { key, angle, ideal };
  }
  return roundCache;
}
function predictLaunch() {
  if (gameState !== "PLAYING" || !predictMode || isLaunched || isSliding) return;
  const r = getRound();
  if (!r) return;
  const guess = parseFloat(spdEl.value);
  const ang = r.angle * Math.PI / 180;
  predictRight = r.ideal !== null && Math.abs(guess - r.ideal) / r.ideal <= PERFECT_TOLERANCE;
  charVx = guess * Math.cos(ang);
  charVy = -guess * Math.sin(ang);
  isLaunched = true;
  ac(); sfx.launch();
}
function missPredict() {
  lives--;
  score = Math.max(0, score - 1);
  predictRight = false;
  if (lives <= 0) { saveScore(); gameState = "GAMEOVER"; return; }
  toast = { text: "MISSED! -1 POINT", color: "#ff3f34", t: 110 };
  charX = restX;
  charY = buildings[currentBuildingIdx].y - charRadius;
  charVx = 0; charVy = 0; isLaunched = false; isSliding = false; currentForce = 0;
}

// ---------- sound (synthesized, no audio files needed) ----------
let audioCtx = null, musicGain = null, muted = false, musicOn = true;
try { musicOn = localStorage.getItem("music") !== "0"; } catch (e) {}
try { muted = localStorage.getItem("muted") === "1"; } catch (e) {}
function ac() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(audioCtx.destination);
    } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(f, d, type, vol, endF, delay) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if (endF) o.frequency.exponentialRampToValueAtTime(endF, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function noiseBurst(d, vol, freq) {
  const a = ac(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; flt.type = "lowpass"; flt.frequency.value = freq; g.gain.value = vol;
  src.connect(flt); flt.connect(g); g.connect(a.destination); src.start();
}
const sfx = {
  click()   { tone(660, 0.07, "square", 0.05, 880); },
  launch()  { tone(180, 0.35, "sawtooth", 0.07, 700); noiseBurst(0.3, 0.12, 1800); },
  land(imp) { tone(120, 0.18, "sine", Math.min(0.25, 0.08 + imp * 0.015), 50); noiseBurst(0.15, Math.min(0.2, 0.05 + imp * 0.01), 700); },
  perfect() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, "triangle", 0.12, 0, i * 0.07)); },
  miss()    { tone(300, 0.5, "sawtooth", 0.09, 60); },
};
// ---------- music: a chill looping tune made from synth notes (no audio files) ----------
const BPM = 104, STEP = 60 / BPM / 2;                    // one step = an eighth note
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];   // Am  F  C  G
const ARP = [0, 1, 2, 1, 2, 1, 0, 2];
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
let musicTimer = null, nextNoteTime = 0, musicStep = 0;
function mNote(f, t, d, type, vol) {
  const a = audioCtx; if (!a || !musicGain) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + d + 0.05);
}
function scheduleMusic() {
  const a = audioCtx; if (!a) return;
  while (nextNoteTime < a.currentTime + 0.3) {
    const ch = CHORDS[Math.floor(musicStep / 8) % 4], i = musicStep % 8;
    mNote(mtof(ch[ARP[i]] + 12), nextNoteTime, STEP * 1.8, "triangle", 0.06);          // arpeggio
    if (i % 4 === 0) mNote(mtof(ch[0] - 12), nextNoteTime, STEP * 3.6, "sine", 0.16);  // bass
    if (i === 0) ch.forEach((n) => mNote(mtof(n), nextNoteTime, STEP * 7.5, "sine", 0.03)); // pad
    nextNoteTime += STEP; musicStep++;
  }
}
function startMusic() {
  const a = ac(); if (!a || musicTimer || !musicOn || muted) return;
  if (musicGain) musicGain.gain.value = 0.5;
  nextNoteTime = a.currentTime + 0.1; musicStep = 0;
  musicTimer = setInterval(scheduleMusic, 100);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  if (musicGain) musicGain.gain.value = 0;
}
function applyAudio() {
  musicBtn.classList.toggle("off", !musicOn);
  if (musicOn && !muted) { if (audioCtx) startMusic(); } else stopMusic();
}
function setMuted(m) {
  muted = m; muteBtn.textContent = m ? "🔇" : "🔊";
  try { localStorage.setItem("muted", m ? "1" : "0"); } catch (e) {}
  applyAudio();
}
function setMusic(on) {
  musicOn = on;
  try { localStorage.setItem("music", on ? "1" : "0"); } catch (e) {}
  applyAudio();
}
muteBtn.addEventListener("click", () => { ac(); setMuted(!muted); sfx.click(); });
musicBtn.addEventListener("click", () => { ac(); setMusic(!musicOn); sfx.click(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "m" || e.key === "M") setMuted(!muted);
  if (e.key === "n" || e.key === "N") setMusic(!musicOn);
});
setMuted(muted);

// ---------- scenery ----------
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.75, r: Math.random() * 1.4 + 0.5, p: Math.random() * 6.28 }));
const skyline = (() => {
  const a = []; let x = 0;
  for (let i = 0; i < 40; i++) { const w = 60 + Math.random() * 80; a.push({ x, w, h: 80 + Math.random() * 180 }); x += w + 10 + Math.random() * 30; }
  return { a, L: x };
})();
function drawSky(sx, sy) {
  const g = ctx.createLinearGradient(0, 0, 0, sh);
  g.addColorStop(0, "#0a0e27"); g.addColorStop(0.55, "#2a1b4d"); g.addColorStop(1, "#c2477c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
  const t = Date.now() / 1000;
  ctx.fillStyle = "#fff";
  for (const st of stars) { ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.8 + st.p)); ctx.fillRect(st.x * sw, st.y * sh, st.r, st.r); }
  ctx.globalAlpha = 1;
  ctx.save(); ctx.shadowColor = "#fff6c8"; ctx.shadowBlur = 40; ctx.fillStyle = "#fff6d5";
  ctx.beginPath(); ctx.arc(sw * 0.85, sh * 0.2, 34 * sy, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#1a1840";                          // distant skyline, scrolls slowly (parallax)
  for (const f of skyline.a) {
    const px = (((f.x - cameraScroll * 0.25) % skyline.L) + skyline.L) % skyline.L - 150;
    if (px * sx > sw || (px + f.w) * sx < 0) continue;
    ctx.fillRect(px * sx, sh - f.h * sy, f.w * sx, f.h * sy);
  }
}
function drawBuilding(b, screenX, bw, sx, sy) {
  const top = b.y * sy;
  const g = ctx.createLinearGradient(0, top, 0, sh);
  g.addColorStop(0, "#46566a"); g.addColorStop(1, "#1f2833");
  ctx.fillStyle = g; ctx.fillRect(screenX, top, bw, sh - top);
  const ww = 10 * sx, wh = 14 * sy, gx = 22 * sx, gy = 30 * sy;
  const cols = Math.max(1, Math.floor((bw - 12 * sx) / gx));
  const padX = (bw - cols * gx + (gx - ww)) / 2;
  for (let r = 0; top + 18 * sy + r * gy < sh; r++) for (let c = 0; c < cols; c++) {
    const h2 = Math.sin(b.x * 12.9898 + r * 78.233 + c * 37.719) * 43758.5453;
    ctx.fillStyle = (h2 - Math.floor(h2)) > 0.45 ? "#ffd479" : "#2c3745";
    ctx.fillRect(screenX + padX + c * gx, top + 18 * sy + r * gy, ww, wh);
  }
  ctx.save(); ctx.shadowColor = "#05c46b"; ctx.shadowBlur = 12; ctx.fillStyle = "#05c46b";
  ctx.fillRect(screenX, top, bw, 5 * sy); ctx.restore();
}
function panelBox(x, y, w, h) {
  ctx.save(); ctx.fillStyle = "rgba(10,14,39,0.55)"; ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke(); ctx.restore();
}

// ---------- flair ----------
function burst(x, y, n, colors, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * speed;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - speed * 0.4,
      life: 30 + Math.random() * 25, max: 55, size: 2 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)] });
  }
}
function updateFx() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99; p.life--; }
  particles = particles.filter(p => p.life > 0);
  shake *= 0.86; if (shake < 0.2) shake = 0;
}
function landFx(impact, b, perfect) {
  sfx.land(impact); if (perfect) sfx.perfect();
  burst(charX, b.y, Math.min(40, 6 + Math.floor(impact * 2)), ["#d2dae2", "#a4b0be", "#ffffff"], 2 + impact * 0.2);
  shake = Math.max(shake, Math.min(impact * 0.7, 10));
  if (perfect) {
    burst(charX, b.y - charRadius, 60, ["#ffdd59", "#05c46b", "#ffffff"], 6);
    shake = Math.max(shake, 8);
  }
}
function drawFx(sx, sy) {
  for (let i = 0; i < trail.length; i++) {          // fading trail behind the ball
    const t = (i + 1) / trail.length;
    ctx.globalAlpha = t * 0.5;
    ctx.fillStyle = predictMode && predictRight ? "#ffdd59" : "#ffffff";
    ctx.beginPath();
    ctx.arc((trail[i][0] - cameraScroll) * sx, trail[i][1] * sy, charRadius * sy * 0.45 * t, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const p of particles) {                       // dust and sparkles
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect((p.x - cameraScroll) * sx, p.y * sy, p.size * sx, p.size * sx);
  }
  ctx.globalAlpha = 1;
}

// ---------- physics ----------
function update() {
  updateFx();
  if (gameState !== "PLAYING") return;
  cameraScroll += (targetScroll - cameraScroll) * 0.08;
  if (toast && --toast.t <= 0) toast = null;
  if (isLaunched || isSliding) ballAngle += charVx * 0.03; else ballAngle *= 0.9;
  if (isLaunched) { trail.push([charX, charY]); if (trail.length > 22) trail.shift(); }
  else if (trail.length) trail.shift();

  if (isLaunched) {
    charVy += GRAVITY;
    charX += charVx;
    charY += charVy;

    if (charY > BASE_HEIGHT + 50 || charY < SKY_LIMIT) {
      shake = 12; sfx.miss();
      if (predictMode) { missPredict(); return; }
      saveScore();
      gameState = "GAMEOVER";
      return;
    }
    for (let idx = currentBuildingIdx; idx <= Math.min(currentBuildingIdx + ACTIVE_AHEAD, buildings.length - 1); idx++) {
      const b = buildings[idx];
      if (b.x - 5 <= charX + charRadius && charX + charRadius <= b.x + 10) {
        if (charY + charRadius > b.y + 10) charVx = -charVx * 0.3;
      }
      if (b.x <= charX && charX <= b.x + b.w) {
        if (b.y <= charY + charRadius && charY + charRadius <= b.y + 16 && charVy > 0) {
          const impact = charVy;
          charY = b.y - charRadius;
          charVy = 0;
          isLaunched = false;
          landFx(impact, b, predictMode && predictRight && idx > currentBuildingIdx);
          if (idx > currentBuildingIdx) {
            const gain = idx - currentBuildingIdx;
            if (predictMode) {
              score += predictRight ? gain * 2 : gain;
              toast = predictRight
                ? { text: "PERFECT! DOUBLE POINTS x2", color: "#05c46b", t: 110 }
                : { text: "LANDED! +" + gain, color: "#ffdd59", t: 110 };
            } else score += gain;
            currentBuildingIdx = idx;
          }
          predictRight = false;
          if (Math.abs(charVx) > 0.5 && charSlide > 0) isSliding = true;
          else lockPosition(b);
          break;
        }
      }
    }
  } else if (isSliding) {
    charVx *= charSlide;
    charX += charVx;
    const cb = buildings[currentBuildingIdx];
    if (!(cb.x <= charX && charX <= cb.x + cb.w)) {
      isSliding = false;
      isLaunched = true;
    } else if (Math.abs(charVx) < 0.2) {
      isSliding = false;
      lockPosition(cb);
    }
  }
}

// ---------- drawing ----------
function text(str, x, y, font, color, align = "left", base = "top", glow) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.shadowColor = glow || "rgba(0,0,0,0.6)"; ctx.shadowBlur = glow ? 22 : 4;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function rect(x1, y1, x2, y2, fill, stroke, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x1, y1, x2 - x1, y2 - y1); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.strokeRect(x1, y1, x2 - x1, y2 - y1); }
}

function drawButtons() {
  const { cx, y1, y2, sx, sy } = buttonBounds();
  const ty = toggleY() * sy;
  [["CLASSIC", -125, false], ["PREDICT", 5, true]].forEach(([label, off, mode]) => {
    const on = predictMode === mode;
    rect(cx + off * sx, ty, cx + (off + 120) * sx, ty + 32 * sy, on ? "#ffdd59" : "rgba(0,0,0,0.45)", "white", 2);
    text(label, cx + (off + 60) * sx, ty + 16 * sy, `bold ${Math.floor(12 * sy)}px Arial`,
         on ? "black" : "white", "center", "middle");
  });
  const defs = [
    [-240, -80, "#ff3f34", "ARACHNE (1.0kg)", "white"],
    [-80, 80, "#05c46b", "NEMESIS (2.5kg)", "white"],
    [80, 240, "#34e7e4", "DANGO (5.0kg)", "black"],
  ];
  for (const [a, b, fill, label, tc] of defs) {
    rect(cx + a * sx, y1, cx + b * sx, y2, fill, "white", 2);
    text(label, cx + ((a + b) / 2) * sx, (y1 + y2) / 2,
         `bold ${Math.floor(11 * sy)}px Arial`, tc, "center", "middle");
  }
}

function drawPredictUI(sx, sy) {
  const playing = gameState === "PLAYING" && predictMode;
  const show = playing && !isLaunched && !isSliding && !!buildings[currentBuildingIdx + 1];
  panel.style.display = show ? "block" : "none";
  if (show) {
    const cb = buildings[currentBuildingIdx], nb = buildings[currentBuildingIdx + 1];
    const gap = nb.x - (cb.x + cb.w), dh = cb.y - nb.y;
    const hText = dh > 0 ? dh + " m higher" : dh < 0 ? (-dh) + " m lower" : "level";
    infoEl.textContent = `Gap: ${gap} m | Next roof: ${hText} | Angle: ${getRound().angle}° | g = ${GRAVITY}`;
    const v = parseFloat(spdEl.value);
    valEl.textContent = v.toFixed(1);
    forceEl.textContent = `${charName} needs ${(v * charMass / 0.42).toFixed(1)} N for that speed`;
  }
  if (playing) {
    text("LIVES: " + "♥".repeat(Math.max(0, lives)), 25 * sx, 115 * sy,
         `bold ${Math.floor(12 * sy)}px Arial`, "#ff3f34");
    if (toast) text(toast.text, sw / 2, 70 * sy,
         `${Math.floor(30 * sy * (1 + Math.max(0, toast.t - 95) / 30))}px Impact, Arial Black, sans-serif`, toast.color, "center", "middle");
  }
}

function draw() {
  ctx.clearRect(0, 0, sw, sh);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
  drawScene();
  ctx.restore();
}
function drawScene() {
  const sx = sw / BASE_WIDTH, sy = sh / BASE_HEIGHT;

  // background
  if (bgImg.ok) ctx.drawImage(bgImg, 0, 0, sw, sh);
  else drawSky(sx, sy);

  // atmosphere limit
  ctx.strokeStyle = "#ff3f34"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(0, SKY_LIMIT * sy); ctx.lineTo(sw, SKY_LIMIT * sy); ctx.stroke();
  ctx.setLineDash([]);
  text("OUT OF ATMOSPHERE ZONE", sw - 15, (SKY_LIMIT + 8) * sy,
       `bold ${Math.floor(8 * sy)}px Arial`, "#ff3f34", "right", "middle");

  // buildings
  for (let i = Math.max(0, currentBuildingIdx - 1); i <= Math.min(currentBuildingIdx + ACTIVE_AHEAD, buildings.length - 1); i++) {
    const b = buildings[i];
    const screenX = (b.x - cameraScroll) * sx;
    if (screenX > -200 && screenX < sw + 200) {
      const bw = Math.floor(b.w * sx), bh = Math.floor((BASE_HEIGHT - b.y) * sy);
      if (buildingImg.ok) {
        ctx.drawImage(buildingImg, screenX, b.y * sy, bw, bh);
      } else {
        drawBuilding(b, screenX, bw, sx, sy);
      }
    }
  }

  // aiming trajectory
  if (gameState === "PLAYING" && aiming) {
    const scx = (charX - cameraScroll) * sx, scy = charY * sy;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.setLineDash([4, 2]);
    ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(mx, my); ctx.stroke();
    ctx.setLineDash([]);

    let simX = charX - cameraScroll, simY = charY;
    const dx = mx / sx - simX, dy = my / sy - simY;
    const angle = Math.atan2(dy, dx), dist = Math.hypot(dx, dy);
    const speed = Math.min((Math.min(dist * AIM_SENS, 200) / charMass) * 0.42, MAX_SPEED);
    const svx = speed * Math.cos(angle);
    let svy = speed * Math.sin(angle);
    ctx.fillStyle = "#ffdd59";
    for (let i = 0; i < 90; i++) {
      svy += GRAVITY; simX += svx; simY += svy;
      if (simY > BASE_HEIGHT || simY < SKY_LIMIT) break;
      ctx.beginPath();
      ctx.ellipse(simX * sx, simY * sy, 2 * sx, 2 * sy, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawFx(sx, sy);

  // character + HUD
  if (gameState === "PLAYING") {
    const cx = (charX - cameraScroll) * sx, cy = charY * sy;
    const r = charRadius * sy;
    let state = isLaunched ? "launched" : isSliding ? "landed" : (score > 0 ? "landed" : "idle");
    const img = charSprites[state];
    if (img && img.ok) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ballAngle); ctx.drawImage(img, -r, -r, r * 2, r * 2); ctx.restore();
    } else {
      ctx.save();
      ctx.shadowColor = charColor; ctx.shadowBlur = 22;
      const bgr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
      bgr.addColorStop(0, "#ffffff"); bgr.addColorStop(0.25, charColor); bgr.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = charColor; ctx.fill();
      ctx.fillStyle = bgr; ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }

    // force bar
    const barW = Math.floor(currentForce * sx);
    rect(sw - 250 * sx, 25 * sy, sw - 48 * sx, 45 * sy, null, "white", 2);
    if (barW > 0) rect(sw - 248 * sx, 27 * sy, sw - 248 * sx + barW, 43 * sy, "#ffdd59");
    text(`FORCE: ${currentForce.toFixed(1)} N`, sw - 260 * sx, 35 * sy,
         `${Math.floor(14 * sy)}px Impact, Arial Black, sans-serif`, "#ffdd59", "right", "middle");
    if (!predictMode) text(`SPEED: ${Math.min(currentForce / charMass * 0.42, MAX_SPEED).toFixed(1)} m/s`, sw - 48 * sx, 62 * sy,
         `bold ${Math.floor(12 * sy)}px Arial`, "#d2dae2", "right", "middle");

    // gap distance
    let distText = "Next Gap: End of Course";
    const next = currentBuildingIdx + 1;
    if (next < buildings.length) {
      const cb = buildings[currentBuildingIdx], nb = buildings[next];
      distText = `Next Gap: ${nb.x - (cb.x + cb.w)}m`;
    }
    panelBox(12 * sx, 12 * sy, 260 * sx, (predictMode ? 134 : 110) * sy);
    text(`SCORE: ${score}`, 25 * sx, 25 * sy,
         `${Math.floor(28 * sy)}px Impact, Arial Black, sans-serif`, "#05c46b");
    text(`Projectile: ${charName}`, 25 * sx, 65 * sy,
         `bold ${Math.floor(11 * sy)}px Arial`, "#fff");
    text(distText, 25 * sx, 90 * sy, `bold ${Math.floor(10 * sy)}px Arial`, "#ffdd59");
  }

  drawPredictUI(sx, sy);

  // overlays
  const impact = (n) => `${Math.floor(n * sy)}px Impact, Arial Black, sans-serif`;
  if (gameState === "MENU") {
    text("PRODUCED PHYSICS LAUNCHER", sw / 2, 120 * sy, impact(42), "#05c46b", "center", "middle", "#05c46b");
    text("SELECT YOUR PROJECTILE TO BEGIN:", sw / 2, 180 * sy,
         `bold ${Math.floor(14 * sy)}px Arial`, "white", "center", "middle");
    drawButtons();
  } else if (gameState === "GAMEOVER") {
    rect(0, 0, sw, sh, "rgba(0,0,0,0.5)");
    text("GAME OVER", sw / 2, 80 * sy, impact(44), "#ff3f34", "center", "middle", "#ff3f34");
    text(`YOUR SCORE: ${score}`, sw / 2, 130 * sy,
         `bold ${Math.floor(16 * sy)}px Arial`, "white", "center", "middle");
    text("🏆 LOCAL TOP 5 HIGH SCORES 🏆", sw / 2, 180 * sy,
         `bold ${Math.floor(12 * sy)}px Arial`, "#ffdd59", "center", "middle");
    let y = 210;
    highScores.forEach((s, rank) => {
      const prefix = rank === 0 ? "⭐ " : `${rank + 1}. `;
      text(`${prefix}${s} Buildings Cleared`, sw / 2, y * sy,
           `${Math.floor(11 * sy)}px Arial`, "#d2dae2", "center", "middle");
      y += 24;
    });
    text("PLAY AGAIN? SELECT NEXT BALL CLASS:", sw / 2, 385 * sy,
         `bold ${Math.floor(13 * sy)}px Arial`, "white", "center", "middle");
    drawButtons();
  }
}

// ---------- loop & resize ----------
function resize() {
  sw = canvas.width = window.innerWidth;
  sh = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= 16) { update(); acc -= 16; }
  draw();
  requestAnimationFrame(frame);
}

resize();
loadLeaderboard();
setupBuildings();
requestAnimationFrame(frame);
</script>
</body>
</html>
